<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Raznul Asri</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      font-family: Arial, sans-serif;
      color: #f0f0f0;
    }
    .card {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
      text-align: center;
      max-width: 400px;
    }
    .card h1 {
      margin: 0;
      font-size: 28px;
      color: #ffffff;
    }
    .card h2 {
      margin: 10px 0;
      font-size: 18px;
      font-weight: normal;
      color: #bbbbbb;
    }
    .skills {
      margin: 20px 0;
    }
    .skills span {
      display: inline-block;
      background-color: #2a2a2a;
      padding: 8px 12px;
      margin: 5px;
      border-radius: 6px;
      font-size: 14px;
      color: #00adb5;
    }
    .fact {
      font-style: italic;
      color: #cccccc;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Raznul Asri</h1>
    <h2>Linux Support, Cloud Administrator</h2>
    <div class="skills">
      <span>Linux</span>
      <span>Git</span>
      <span>Docker</span>
    </div>
    <p class="fact">Peminat tegar teknologi open-source yang sentiasa mencari jalan untuk mengautomasikan tugasan harian</p>
  </div>
</body>
</html>
